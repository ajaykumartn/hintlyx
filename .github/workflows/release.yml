name: Build installers

# Builds Windows and macOS installers on GitHub's runners (free) and attaches them to the
# GitHub Release. Trigger by pushing a version tag like v0.1.1, or run manually from the
# Actions tab. macOS builds are unsigned (no paid Apple account needed); users open them with
# right-click -> Open the first time.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Build one OS at a time so the two jobs never race to create the same GitHub Release.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            ebflag: '--win'
          - os: macos-latest
            ebflag: '--mac'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer and main
        run: npm run build

      - name: Package installer
        # Build only; this also writes the auto-update metadata (latest.yml / latest-mac.yml)
        # into release/ because a publish provider is configured. We upload with gh below so the
        # two OS jobs never race to create the GitHub Release.
        run: npx electron-builder ${{ matrix.ebflag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          gh release create "$TAG" -t "Hintlyx $TAG" -n "Automated build. Windows and macOS installers attached. On first run, Windows: More info -> Run anyway; macOS: right-click -> Open." || true
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.yml release/*.blockmap)
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hintlyx-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: ignore
